<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style>
<title>Румми</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Rubik+Mono+One&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: walnut game table. Top: players strip. Middle: the shared table of sets (scrolls). Bottom: your rack and turn controls, pinned. Single deliberate look. */
:root{
  --wood-1:#4a3424; --wood-2:#36251a; --wood-3:#2a1c13; --ink:#f6eee2; --muted:#c9b8a3; --accent:#f0b03f; --accent-ink:#2a1a05;
  --tile:#f8f1e1; --tile-edge:#dccdb0; --tile-shadow:rgba(0,0,0,.45);
  --c0:#1d1d22; --c1:#c8202f; --c2:#1f5fbf; --c3:#e07410;
  --ok:#5fc27a; --bad:#ff6b5b; --panel:rgba(20,13,8,.72); --line:rgba(255,235,205,.16);
  --f-title:"Rubik Mono One", "Arial Black", sans-serif;
  --f-num:"Rubik", system-ui, sans-serif;
  --f-ui:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tw:46px; --tt:40px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-ui);overflow:hidden;
  background:
    repeating-linear-gradient(92deg, rgba(255,255,255,.018) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(88deg, rgba(0,0,0,.05) 0 1px, transparent 1px 23px),
    radial-gradient(ellipse 120% 80% at 50% 35%, var(--wood-1), var(--wood-2) 60%, var(--wood-3));
  background-color:var(--wood-2);
  -webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font:500 15px/1 var(--f-ui);color:var(--ink);background:rgba(255,240,215,.08);border:1px solid var(--line);border-radius:12px;padding:11px 16px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s, transform .1s}
button:hover{background:rgba(255,240,215,.15)}
button:active{transform:scale(.97)}
button:disabled{opacity:.38;cursor:default;transform:none}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{background:#ffc35a}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:500 15px var(--f-ui);color:var(--ink);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
select option{background:#2a1c13}

/* ---------- Tiles ---------- */
.tile{width:var(--tw);height:calc(var(--tw) * 1.34);border-radius:calc(var(--tw) * .14);background:linear-gradient(180deg,#fffaf0,var(--tile) 60%,#efe4cc);
  box-shadow:0 2px 0 var(--tile-edge), 0 3px 0 #bfae8c, 0 5px 8px var(--tile-shadow);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;transition:transform .12s, box-shadow .12s, opacity .12s}
.tile b{font:800 calc(var(--tw) * .56)/1 var(--f-num);letter-spacing:-.03em;margin-top:-6%}
.tile i{position:absolute;bottom:13%;width:calc(var(--tw) * .2);height:calc(var(--tw) * .2);border-radius:50%;border:calc(var(--tw) * .035) solid currentColor;opacity:.75;box-sizing:border-box}
.tile.c0{color:var(--c0)} .tile.c1{color:var(--c1)} .tile.c2{color:var(--c2)} .tile.c3{color:var(--c3)}
.tile.joker svg{width:72%;height:72%}
.tile.sel{transform:translateY(-6px);box-shadow:0 2px 0 var(--tile-edge), 0 3px 0 #bfae8c, 0 0 0 3px var(--accent), 0 10px 14px var(--tile-shadow)}
.tile.mine::after{content:"";position:absolute;top:5%;left:50%;transform:translateX(-50%);width:30%;height:3px;border-radius:2px;background:var(--accent)}
.tile.last{box-shadow:0 2px 0 var(--tile-edge), 0 3px 0 #bfae8c, 0 0 0 2px rgba(240,176,63,.75), 0 5px 10px var(--tile-shadow)}
.tile.drawn{animation:drawn 1.2s ease 2}
@keyframes drawn{50%{box-shadow:0 2px 0 var(--tile-edge),0 3px 0 #bfae8c,0 0 0 4px var(--accent),0 5px 8px var(--tile-shadow)}}
.tile.ghosted{opacity:.25}
.tile.locked{cursor:default}
.ghost{position:fixed;z-index:100;pointer-events:none;display:flex;gap:3px;transform:translate(-50%,-60%) rotate(-3deg)}
.ghost .tile{box-shadow:0 14px 26px rgba(0,0,0,.55)}

/* ---------- Screens ---------- */
.screen{flex:1;min-height:0;overflow:auto;padding-block:24px}
.menu{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand h1{font:400 clamp(40px,9vw,72px)/.9 var(--f-title);margin:0;letter-spacing:-.02em;color:var(--ink)}
.brand .row{display:flex;gap:6px}
.brand p{margin:6px 0 0;color:var(--muted);font-size:16px;max-width:52ch;line-height:1.4}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font:600 20px var(--f-ui)}
.card p{margin:0;color:var(--muted);line-height:1.45;font-size:14px}
.seat{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px}
.seats{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.code{font:400 30px/1 var(--f-title);letter-spacing:.06em;color:var(--accent)}
.linkbox{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;min-width:0}
.linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--muted);user-select:all;-webkit-user-select:all}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.22);border-radius:10px;padding:10px 12px;font-size:15px}
.pl small{color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.err{color:var(--bad)}

/* ---------- Game ---------- */
.top{display:flex;align-items:center;gap:10px;padding-block:10px 6px;min-width:0}
.top .logo{font:400 18px var(--f-title);letter-spacing:-.02em}
.players{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.players::-webkit-scrollbar{display:none}
.pchip{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;white-space:nowrap;font-size:14px;flex:none}
.pchip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-num);background:#6b4f3a;color:var(--ink)}
.pchip b{font:600 14px var(--f-num);font-variant-numeric:tabular-nums}
.pchip small{color:var(--muted);font-size:12px}
.pchip.turn{border-color:var(--accent);background:rgba(240,176,63,.16)}
.pchip.turn .av{background:var(--accent);color:var(--accent-ink)}
.pchip.off{opacity:.5}
.pool{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{padding:9px 11px;border-radius:10px}

.zoom{display:flex;gap:4px;flex:none}
.zoom button{width:36px;height:36px;padding:0;border-radius:9px;font:600 18px var(--f-num)}
.tablewrap{flex:1;min-height:0;overflow:auto;border-radius:16px;background:rgba(0,0,0,.16);box-shadow:inset 0 2px 18px rgba(0,0,0,.35);position:relative}
#table{--tw:var(--tt);display:flex;flex-wrap:wrap;align-content:flex-start;gap:14px 18px;padding:14px;min-height:100%;box-sizing:border-box}
.set{display:flex;gap:3px;padding:6px;border-radius:12px;border:1.5px dashed transparent;min-height:calc(var(--tw) * 1.34);position:relative}
.set.bad{border-color:var(--bad);background:rgba(255,107,91,.08)}
.set.good.fresh{border-color:rgba(95,194,122,.6)}
.set.hover,.newset.hover,.rackzone.hover{background:rgba(240,176,63,.14);border-color:var(--accent)}
.set .plus{display:none;width:calc(var(--tw) * .7);border-radius:8px;border:1.5px dashed var(--accent);color:var(--accent);font:600 20px var(--f-num);align-items:center;justify-content:center;cursor:pointer;background:none;padding:0}
.picking .set .plus{display:flex}
.newset{display:flex;align-items:center;justify-content:center;gap:8px;min-width:calc(var(--tw) * 3.2);min-height:calc(var(--tw) * 1.34 + 12px);border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;padding:0 14px;cursor:pointer;box-sizing:border-box}
.empty-hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px;pointer-events:none;text-align:center;padding:20px}

.bottom{padding-block:8px 12px;display:flex;flex-direction:column;gap:8px}
.bottom > *{flex-shrink:0}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px}
.status .msg{flex:1;min-width:180px;font-size:15px;line-height:1.35}
.status .msg b{color:var(--accent)}
.meter{display:inline-block;width:90px;height:7px;border-radius:4px;background:rgba(255,255,255,.12);vertical-align:middle;margin-left:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.rackzone{background:linear-gradient(180deg,#7a5639,#5c3f29);border-radius:14px;padding:10px;box-shadow:inset 0 2px 0 rgba(255,220,180,.25), 0 8px 18px rgba(0,0,0,.4);border:1.5px solid transparent;position:relative}
#rack{display:flex;flex-wrap:wrap;gap:5px;min-height:calc(var(--tw) * 1.34);max-height:calc(var(--tw) * 1.34 * 2 + 18px);overflow-y:auto;padding-bottom:4px}
.rackbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:#f2dcc0}
.rackbar .sorts{display:flex;gap:6px}
.rackbar button{padding:6px 10px;font-size:13px;border-radius:8px;background:rgba(0,0,0,.2)}
.rackbar button[aria-pressed="true"]{background:rgba(0,0,0,.45);border-color:var(--accent)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 70px);transform:translateX(-50%);z-index:200;background:#1c120b;border:1px solid var(--accent);color:var(--ink);
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
.overlay{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:rgba(15,9,5,.72);padding:16px;backdrop-filter:blur(3px)}
.modal{background:#2b1d13;border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:440px;box-shadow:0 30px 70px rgba(0,0,0,.6);max-height:100%;overflow:auto;box-sizing:border-box}
.modal h2{font:600 24px var(--f-ui);margin:0 0 8px}
.modal p,.modal li{color:var(--muted);line-height:1.5;font-size:15px}
.modal ul{padding-left:20px;margin:8px 0}
.modal table{width:100%;border-collapse:collapse;margin:10px 0;font-variant-numeric:tabular-nums}
.modal td,.modal th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.modal th{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.modal td.num{text-align:right}
.modal .win{color:var(--accent);font-weight:600}
.modal .row{justify-content:flex-end;margin-top:14px}
.ex{display:flex;gap:3px;margin:6px 0 10px;--tw:30px}
.ex .tile{cursor:default}

@media (max-width:640px){
  :root{--tw:min(10.6vw, 46px)}
  #rack{max-height:calc(var(--tw) * 1.34 * 3 + 16px)}
  .meter{width:70px}
  .pool{font-size:12px}
  .zoom button{width:32px;height:32px}
  .set .plus{width:30px}
  .screen{padding-block:14px}
  .top{padding-block:8px 4px;gap:6px}
  .top .logo{display:none}
  .pchip{padding:4px 10px 4px 4px;font-size:13px}
  .pchip .av{width:22px;height:22px;font-size:11px}
  #table{gap:10px 10px;padding:10px}
  .set{padding:4px;gap:2px}
  .status .msg{font-size:14px;min-width:0;flex-basis:100%}
  .status{min-height:0;gap:6px}
  .actions{width:100%}
  .actions button{flex:1 1 0;padding:12px 6px;font-size:14px}
  .rackzone{padding:8px}
  #rack{gap:4px}
  .seat{grid-template-columns:minmax(0,1fr) 130px}
  .pchip small,.pchip .you{display:none}
  .rackbar .log{display:none}
}
@media (orientation:landscape) and (max-height:540px){
  :root{--tw:min(4.9vw, 42px)}
  .pchip small,.pchip .you,.rackbar .log{display:none}
  .status{min-height:0;gap:6px}
  #app.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,44%);grid-template-rows:auto minmax(0,1fr);column-gap:12px}
  #app.game .top{grid-column:1 / -1;padding-block:6px 4px}
  #app.game .tablewrap{grid-row:2;min-height:0}
  #app.game .bottom{grid-row:2;grid-column:2;overflow:auto;padding-block:0 8px}
  #app.game #rack{max-height:none}
  .status .msg{flex-basis:100%;font-size:14px}
  .actions{width:100%}
  .actions button{flex:1 1 0;padding:11px 6px}
  .top .logo{display:none}
}
@media (prefers-reduced-motion:reduce){.tile,.toast{transition:none;animation:none}}
</style>
</head>
<body>

<div id="app"></div>

<script>
(() => {
// ======================= Tiles & rules =======================
const COLORS = ['чёрный', 'красный', 'синий', 'оранжевый'];
const T = [];
for (let k = 0; k < 2; k++) for (let c = 0; c < 4; c++) for (let n = 1; n <= 13; n++) T.push({ id: T.length, c, n });
T.push({ id: 104, c: -1, n: 0 }, { id: 105, c: -1, n: 0 });
const isJ = id => T[id].c < 0;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rackValue = ids => ids.reduce((s, id) => s + (isJ(id) ? 30 : T[id].n), 0);

// Returns {type, pts, order} for a valid set, otherwise null
function analyze(ids) {
  const L = ids.length;
  if (L < 3) return null;
  const nj = ids.filter(id => !isJ(id)), jk = ids.filter(isJ);
  if (!nj.length) return null;
  let best = null;
  // group: same number, different colours, 3-4 tiles
  if (L <= 4) {
    const n = T[nj[0]].n;
    if (nj.every(id => T[id].n === n) && new Set(nj.map(id => T[id].c)).size === nj.length)
      best = { type: 'group', pts: n * L, order: [...nj.slice().sort((a, b) => T[a].c - T[b].c), ...jk] };
  }
  // run: same colour, consecutive numbers, jokers fill gaps
  if (L <= 13) {
    const c = T[nj[0]].c, nums = nj.map(id => T[id].n);
    if (nj.every(id => T[id].c === c) && new Set(nums).size === nums.length) {
      const mn = Math.min(...nums), mx = Math.max(...nums);
      if (mx - mn + 1 <= L) {
        // keep the player's arrangement when it is already a consistent run
        let s = null;
        const k0 = ids.findIndex(id => !isJ(id)), s0 = T[ids[k0]].n - k0;
        if (s0 >= 1 && s0 + L - 1 <= 13 && ids.every((id, k) => isJ(id) || T[id].n === s0 + k)) s = s0;
        let order;
        if (s !== null) order = ids.slice();
        else {
          s = Math.min(mn, 14 - L);
          const pool = jk.slice();
          order = [];
          for (let k = 0; k < L; k++) { const t = nj.find(id => T[id].n === s + k); order.push(t !== undefined ? t : pool.pop()); }
        }
        let pts = 0; for (let k = 0; k < L; k++) pts += s + k;
        if (!best || pts > best.pts) best = { type: 'run', pts, order };
      }
    }
  }
  return best;
}
const normalize = ids => { const a = analyze(ids); return a ? a.order : ids; };
const sig = ids => ids.slice().sort((a, b) => a - b).join(',');

// ======================= Engine (runs on the host / this device) =======================
let G = null;
function newGame(seats, keepScores) {
  const ids = shuffle([...Array(106).keys()]);
  const players = seats.map((s, i) => ({ name: s.name, kind: s.kind, level: s.level || 1, token: s.token || null,
    rack: ids.splice(0, 14), melded: false, connected: s.connected !== false, score: keepScores && G && G.players[i] ? G.players[i].score : 0 }));
  G = { players, table: [], pool: ids, turn: Math.floor(Math.random() * players.length), turnId: 1, over: null, passes: 0, last: [], drawn: {}, log: ['Партия началась. Фишки розданы по 14.'], round: keepScores && G ? G.round + 1 : 1 };
}
function validate(pi, table, rack) {
  const p = G.players[pi];
  const before = [...G.table.flat(), ...p.rack], after = [...table.flat(), ...rack];
  if (before.length !== after.length || sig(before) !== sig(after)) return 'Фишки не сходятся. Нажмите «Вернуть всё» и попробуйте ещё раз.';
  const onTable = new Set(table.flat());
  if (G.table.flat().some(id => !onTable.has(id))) return 'Фишки со стола нельзя забирать к себе.';
  const placed = p.rack.filter(id => !rack.includes(id));
  if (!placed.length) return 'Выложите хотя бы одну фишку или возьмите фишку из банка.';
  for (const s of table) if (!analyze(s)) return 'На столе есть неправильный ряд (обведён красным).';
  if (!p.melded) {
    const orig = new Set(G.table.map(sig)), origTiles = new Set(G.table.flat());
    let pts = 0;
    for (const s of table) {
      if (s.some(id => origTiles.has(id))) { if (!orig.has(sig(s))) return 'До первого выхода нельзя менять ряды на столе.'; }
      else pts += analyze(s).pts;
    }
    if (pts < 30) return `Для первого выхода нужно не меньше 30 очков из своих фишек. Сейчас ${pts}.`;
  }
  return null;
}
function doCommit(pi, table, rack) {
  if (G.over || G.turn !== pi) return 'Сейчас не ваш ход.';
  table = table.filter(s => s.length).map(normalize);
  const err = validate(pi, table, rack);
  if (err) return err;
  const p = G.players[pi];
  const placed = p.rack.filter(id => !rack.includes(id));
  G.table = table; p.rack = rack; p.melded = true; G.last = placed; G.drawn[pi] = null; G.passes = 0;
  logMsg(`${p.name}: выложил${p.kind === 'bot' ? '(а)' : ''} ${placed.length} ${plural(placed.length, 'фишку', 'фишки', 'фишек')}.`);
  if (!rack.length) finish(pi); else nextTurn();
  return null;
}
function doDraw(pi) {
  if (G.over || G.turn !== pi) return 'Сейчас не ваш ход.';
  const p = G.players[pi];
  if (G.pool.length) { const id = G.pool.pop(); p.rack.push(id); G.drawn[pi] = id; G.passes = 0; logMsg(`${p.name}: взял(а) фишку из банка.`); }
  else { G.passes++; logMsg(`${p.name}: банк пуст, пропуск хода.`); if (G.passes >= G.players.length) { finish(null); return null; } }
  G.last = [];
  nextTurn();
  return null;
}
function nextTurn() { G.turn = (G.turn + 1) % G.players.length; G.turnId++; }
function finish(winner) {
  const pen = G.players.map(p => rackValue(p.rack));
  if (winner === null) { const m = Math.min(...pen); winner = pen.indexOf(m); }
  const gain = pen.reduce((s, v, i) => i === winner ? s : s + v, 0) - (G.players[winner].rack.length ? pen[winner] : 0);
  const rows = G.players.map((p, i) => ({ name: p.name, left: p.rack.length, pen: pen[i], delta: i === winner ? gain : -pen[i] }));
  G.players.forEach((p, i) => p.score += rows[i].delta);
  rows.forEach((r, i) => r.total = G.players[i].score);
  G.over = { winner, rows, blocked: G.players[winner].rack.length > 0 };
  logMsg(`${G.players[winner].name} побеждает!`);
  G.turnId++;
}

// ---------- Drag & tap ----------
let drag = null;
app.addEventListener('pointerdown', e => {
  const el = e.target.closest('.tile'); if (!el || el.classList.contains('locked') || !myTurn()) return;
  const id = +el.dataset.id;
  drag = { id, x: e.clientX, y: e.clientY, started: false, pid: e.pointerId, el };
});
app.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.started) {
    if (Math.hypot(dx, dy) < 7) return;
    drag.started = true;
    drag.ids = sel.has(drag.id) ? [...sel] : [drag.id];
    drag.ghost = document.createElement('div'); drag.ghost.className = 'ghost';
    drag.ghost.innerHTML = drag.ids.map(id => tileHTML(id)).join('');
    document.body.appendChild(drag.ghost);
    drag.ids.forEach(id => app.querySelectorAll(`.tile[data-id="${id}"]`).forEach(t => t.classList.add('ghosted')));
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  app.querySelectorAll('.hover').forEach(h => h.classList.remove('hover'));
  const tgt = dropTarget(e.clientX, e.clientY); if (tgt && tgt.el) tgt.el.classList.add('hover');
  // auto-scroll the table while dragging near its edges
  const tw = document.getElementById('tw'); if (tw) { const r = tw.getBoundingClientRect(); if (e.clientY < r.top + 30) tw.scrollTop -= 8; else if (e.clientY > r.bottom - 30 && e.clientY < r.bottom) tw.scrollTop += 8; }
}, { passive: false });
function dropTarget(x, y) {
  const el = document.elementFromPoint(x, y); if (!el) return null;
  const set = el.closest('.set');
  if (set) {
    const tiles = [...set.querySelectorAll('.tile')].filter(t => !drag || !drag.ids.includes(+t.dataset.id));
    let index = tiles.length;
    for (let k = 0; k < tiles.length; k++) { const r = tiles[k].getBoundingClientRect(); if (x < r.left + r.width / 2 && y < r.bottom + 6) { index = k; break; } }
    const setIds = W.table[+set.dataset.s] || [];
    const anchorId = tiles[index] ? +tiles[index].dataset.id : null;
    return { el: set, kind: 'set', s: +set.dataset.s, index: anchorId === null ? 1e9 : setIds.indexOf(anchorId) };
  }
  if (el.closest('#newset') || (el.closest('#table') && !el.closest('.set'))) return { el: document.getElementById('newset'), kind: 'new' };
  if (el.closest('#rackzone')) return { el: document.getElementById('rackzone'), kind: 'rack' };
  return null;
}
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  app.querySelectorAll('.hover').forEach(h => h.classList.remove('hover'));
  if (d.started) {
    d.ghost.remove();
    const tgt = cancel ? null : dropTarget(e.clientX, e.clientY);
    if (tgt) {
      const inRack = W.rack.includes(d.ids[0]);
      if (tgt.kind === 'rack' && d.ids.every(id => W.rack.includes(id))) { render(); return; }
      if (tgt.kind === 'new' && !inRack && d.ids.length && W.table.some(s => s.length === d.ids.length && d.ids.every(id => s.includes(id)))) { render(); return; }
      moveTiles(d.ids, tgt);
    } else render();
    return;
  }
  // tap: select / deselect
  if (sel.has(d.id)) sel.delete(d.id); else sel.add(d.id);
  render();
}
app.addEventListener('pointerup', e => endDrag(e, false));
app.addEventListener('pointercancel', e => endDrag(e, true));

    <p>В игре 106 фишек: числа от 1 до 13 четырёх цветов, каждая по две штуки, и 2 джокера. Каждому раздают по 14. Цель — первым выложить все свои фишки.</p>
    <p><b>Ряд</b> — три и больше подряд идущих числа одного цвета:</p>${ex([2 * 13 + 3, 2 * 13 + 4, 2 * 13 + 5, 2 * 13 + 6])}
    <p><b>Группа</b> — три или четыре одинаковых числа разных цветов:</p>${ex([7, 13 + 7, 39 + 7])}
    <p><b>Джокер</b> заменяет любую фишку.</p>
    <ul>
      <li><b>Первый выход</b>: сумма выложенных за ход рядов и групп должна быть не меньше 30 очков, только из своих фишек.</li>
      <li>Потом можно добавлять фишки к рядам на столе, разбивать и перекладывать их как угодно. К концу хода все ряды на столе должны быть правильными, а фишки со стола нельзя забирать себе.</li>
      <li>Если нечего выложить, возьмите одну фишку из банка, и ход переходит дальше.</li>
      <li>Кто первым выложил все фишки, побеждает. Остальные отдают ему сумму своих фишек, джокер стоит 30.</li>
    </ul>
    <p><b>Как ходить:</b> перетаскивайте фишки пальцем или мышью. Можно и по-другому: нажмите на фишки, чтобы выбрать, затем нажмите «+ Новый ряд» или «+» в конце нужного ряда. «Вернуть всё» отменяет изменения этого хода.</p>
    <div class="row"><button class="primary" id="ok">Понятно</button></div></div>`, true);
  o.querySelector('#ok').onclick = closeOv;
}
let toastT = 0;
function toast(m) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200);
}
window.addEventListener('hashchange', () => { if (!S.mode) render(); });
window.addEventListener('beforeunload', e => { if (S.mode === 'host' && G && !G.over) { e.preventDefault(); e.returnValue = ''; } });

render();
})();
</script>
